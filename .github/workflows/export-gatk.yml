name: Export GATK 4.1.3.0 image to SIF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Pull the official image and verify GATK
        shell: bash
        run: |
          if apptainer pull gatk-from-book.sif docker://us.gcr.io/broad-gatk/gatk:4.1.3.0; then
            mv gatk-from-book.sif gatk-4.1.3.0.sif
            echo "Pulled the image from the book's GCR location."
          else
            echo "GCR pull failed; trying Broad Institute's Docker Hub image."
            apptainer pull gatk-4.1.3.0.sif docker://broadinstitute/gatk:4.1.3.0
          fi

          apptainer exec gatk-4.1.3.0.sif /gatk/gatk --version
          mkdir -p release_parts
          split -b 1500M -d -a 2 gatk-4.1.3.0.sif release_parts/gatk-4.1.3.0.sif.part-
          ls -lh release_parts/

      - name: Publish downloadable parts as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gatk-image-4.1.3.0-sif
          name: GATK 4.1.3.0 Apptainer SIF
          body: >-
            SIF conversion of the publicly distributed Broad Institute GATK 4.1.3.0 container.
            The workflow tries the book's GCR image first, then the Broad Institute Docker Hub image.
            Download every gatk-4.1.3.0.sif.part-* asset and concatenate the parts in filename order.
          files: release_parts/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
